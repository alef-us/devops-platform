name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main finish, so a publish is never cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and test (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test --configuration Release --no-build
          --logger "trx;LogFileName=results.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: TestResults/coverage
          reporttypes: MarkdownSummaryGithub;Cobertura

      - name: Publish coverage summary
        if: always()
        run: cat TestResults/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults

  container:
    name: Container image
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      packages: write
    env:
      IMAGE: devops-platform-api:ci
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: info

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image runs as non-root
        run: |
          user=$(docker image inspect "$IMAGE" --format '{{.Config.User}}')
          echo "image user: '$user'"
          # Numeric and non-zero: Kubernetes runAsNonRoot can only verify a numeric uid.
          if ! [[ "$user" =~ ^[0-9]+$ ]] || [ "$user" -eq 0 ]; then
            echo "::error::the image must run as a numeric non-root uid, got '$user'"; exit 1
          fi
          docker image ls "$IMAGE" --format 'image size: {{.Size}}' >> "$GITHUB_STEP_SUMMARY"

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

      - name: Run container (hardened, as in Kubernetes)
        run: |
          docker run --detach --name api --publish 8080:8080 \
            --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            "$IMAGE"

      - name: Smoke test the container
        run: scripts/smoke-test.sh http://localhost:8080 "$GITHUB_SHA"

      - name: Container logs are JSON
        run: |
          docker logs api > api.log 2>&1
          test -s api.log
          jq -e . api.log > /dev/null
          echo "$(wc -l < api.log) log lines, all valid JSON"

      - name: Container logs
        if: always()
        run: docker logs api 2>&1 || true

      - name: Scan image for vulnerabilities (report)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          format: sarif
          output: trivy.sarif

      - name: Upload scan to GitHub code scanning
        # Pull requests from forks get a read-only token and can't upload.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif
          category: container-image

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: cyclonedx
          output: sbom.cdx.json
          skip-setup-trivy: true

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json

      - name: Fail on fixable HIGH or CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # github.repository is already lowercase here (alef-us/devops-platform), as GHCR requires.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Tags this commit would publish
        run: |
          {
            echo '### Image tags'
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          TAGS: ${{ steps.meta.outputs.tags }}

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image to GHCR
        # Only from main, and only after the tests, smoke test and scan above passed.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
