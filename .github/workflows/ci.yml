name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: Build and test (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test --configuration Release --no-build
          --logger "trx;LogFileName=results.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: TestResults/coverage
          reporttypes: MarkdownSummaryGithub;Cobertura

      - name: Publish coverage summary
        if: always()
        run: cat TestResults/coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults

  container:
    name: Container image
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 20
    env:
      IMAGE: devops-platform-api:ci
    steps:
      - uses: actions/checkout@v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: info

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          build-args: VERSION=sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image runs as non-root
        run: |
          user=$(docker image inspect "$IMAGE" --format '{{.Config.User}}')
          echo "image user: '$user'"
          # Numeric and non-zero: Kubernetes runAsNonRoot can only verify a numeric uid.
          if ! [[ "$user" =~ ^[0-9]+$ ]] || [ "$user" -eq 0 ]; then
            echo "::error::the image must run as a numeric non-root uid, got '$user'"; exit 1
          fi
          docker image ls "$IMAGE" --format 'image size: {{.Size}}' >> "$GITHUB_STEP_SUMMARY"
